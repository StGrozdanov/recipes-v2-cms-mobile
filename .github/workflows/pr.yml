name: pr

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  install_app:
    name: Install
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

  typecheck_app:
    name: Typechecks
    needs: [install_app]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps
      - name: Run typechecks
        run: npm run type-check

  lint_app:
    name: Linters
    needs: [install_app]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps
      - name: Run linters
        run: npm run lint

  unit_test_app:
    name: Unit Tests
    needs: [install_app]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps
      - name: Run unit tests
        run: npm test
